<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>横浜こころとねむりのクリニック｜院内薬剤検索</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap');

:root {
  --green:#72ad96;
  --green-dark:#4f9279;
  --green-light:#eaf5ef;
  --blue:#8bbbd0;
  --ink:#344b48;
  --muted:#82938e;
  --line:#e3ede8;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:28px 18px;
  background:radial-gradient(circle at 10% 5%,#e4f2ec 0,transparent 30%),
  radial-gradient(circle at 95% 90%,#e6f0f6 0,transparent 30%),#f7faf9;
  color:var(--ink);font-family:"Noto Sans JP",sans-serif
}
button,input{font:inherit}
.container{width:min(100%,900px);margin:0 auto}
.header{
  position:relative;display:flex;align-items:center;justify-content:space-between;
  min-height:190px;padding:34px 42px;overflow:hidden;
  border:1px solid #dcece5;border-radius:28px;
  background:linear-gradient(115deg,#e8f5ee,#eaf3f8)
}
.header-copy{position:relative;z-index:1}
.header-label{margin:0 0 8px;color:var(--green-dark);font-size:11px;font-weight:700;letter-spacing:.16em}
.header h1{margin:0;font-size:clamp(25px,4vw,34px);letter-spacing:.04em}
.description{margin:12px 0 0;color:#718781;font-size:13px;line-height:1.8}
.illustration{position:relative;flex:0 0 230px;height:145px}
.medical-circle{position:absolute;top:4px;right:24px;width:132px;height:132px;border-radius:50%;background:#d5eae0}
.medical-cross{position:absolute;top:36px;right:62px;width:58px;height:58px;color:white;font-size:62px;line-height:52px;text-align:center;z-index:2}
.pill{position:absolute;z-index:3;width:72px;height:29px;border:4px solid white;border-radius:30px;transform:rotate(-35deg);background:linear-gradient(90deg,#91cbb0 50%,#fff 50%);box-shadow:0 5px 12px #658c7c20}
.pill-one{right:120px;top:92px}
.pill-two{right:4px;top:105px;transform:rotate(28deg) scale(.8);background:linear-gradient(90deg,#9bc9dc 50%,#fff 50%)}
.small-circle{position:absolute;right:190px;top:22px;width:15px;height:15px;border-radius:50%;background:#a6cfc0}
.search-card,.result-card{
  margin-top:24px;padding:30px 34px;border:1px solid var(--line);
  border-radius:22px;background:white;box-shadow:0 8px 30px #527e6a0b
}
.section-heading{display:flex;align-items:center;gap:10px;margin-bottom:15px;font-size:15px;font-weight:700}
.heading-icon{display:grid;width:30px;height:30px;place-items:center;border-radius:10px;background:var(--green-light);color:var(--green-dark);font-size:20px}
.search-box{position:relative}
.search-box input{
  width:100%;height:60px;padding:0 52px 0 20px;border:1.5px solid #d8e8e0;
  border-radius:14px;outline:none;background:#fbfdfc;color:var(--ink);font-size:15px
}
.search-box input:focus{border-color:var(--green);box-shadow:0 0 0 4px #72ad961c;background:white}
.search-box input::placeholder{color:#a9b8b2}
.search-icon{position:absolute;top:50%;right:19px;transform:translateY(-50%);color:#86ad9b;font-size:23px;pointer-events:none}
.hint{margin:10px 0 0;color:#98a7a1;font-size:11px}
.suggestions{
  position:absolute;z-index:10;top:calc(100% + 7px);left:0;width:100%;
  max-height:300px;overflow-y:auto;margin:0;padding:7px;border:1px solid var(--line);
  border-radius:13px;background:white;box-shadow:0 12px 30px #385c4d18;list-style:none
}
.suggestions li{padding:12px 14px;border-radius:9px;cursor:pointer;font-size:13px}
.suggestions li:hover,.suggestions li.active{background:var(--green-light)}
.suggestions small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
[hidden]{display:none!important}
.result-card{
  min-height:190px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center
}
.result-card.available,.result-card.unavailable,.result-card.restricted{
  align-items:flex-start;text-align:left
}
.result-card.available{border-color:#cce7d8;background:linear-gradient(120deg,#f1faf5,#fff)}
.result-card.unavailable{border-color:#f0dfc9;background:linear-gradient(120deg,#fff8ef,#fff)}
.result-card.restricted{border-color:#edcaca;background:linear-gradient(120deg,#fff3f1,#fff)}
.result-icon{display:grid;width:44px;height:44px;margin-bottom:12px;place-items:center;border-radius:15px;background:var(--green-light);color:var(--green-dark);font-size:23px}
.result-card h2{margin:0;font-size:17px}
.result-card>p{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.8}
.status{display:inline-block;padding:8px 15px;border-radius:30px;font-size:13px;font-weight:700}
.available .status{background:#dff1e6;color:#397c5b}
.unavailable .status{background:#fff0dc;color:#a16b2e}
.restricted .status{background:#fbe1df;color:#a3443e}
.drug-name{margin:16px 0 5px;font-size:23px;font-weight:700;overflow-wrap:anywhere}
.drug-brands{color:#788c83;font-size:13px;line-height:1.8}
.warning{margin-top:16px;padding:13px 16px;border-left:3px solid #e0ad69;border-radius:6px;background:#fff4e6;color:#805e35;font-size:12px;line-height:1.8}
.restricted .warning{border-color:#d98d87;background:#fff0ef;color:#914d49}

/* 慣習として処方可能な薬剤の注記 */
.custom-approved-note{
  margin-top:12px;
  padding:12px 15px;
  border-left:3px solid var(--green);
  border-radius:7px;
  background:#f0f7f5;
  color:#47766b;
  font-size:12px;
  line-height:1.8;
}

.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 5px;color:#a0aea8;font-size:10px}
.disclaimer{margin:18px 5px;color:#a0aea8;font-size:10px;line-height:1.7}
@media(max-width:600px){
  body{padding:12px}
  .header{min-height:160px;padding:25px 22px;border-radius:20px}
  .illustration{flex-basis:105px;transform:scale(.75);transform-origin:right center;margin-left:-35px}
  .description{max-width:230px;font-size:11px}
  .search-card{padding:23px 18px}
  .result-card{padding:23px 19px}
}
@media(max-width:360px){.illustration{display:none}.footer{align-items:flex-start}}
</style>
</head>

<body>
<main class="container">
  <header class="header">
    <div class="header-copy">
      <p class="header-label">CLINIC MEDICATION GUIDE</p>
      <h1>院内薬剤検索</h1>
      <p class="description">薬剤名を入力して、院内での<br>処方可否を確認できます。</p>
    </div>
    <div class="illustration" aria-hidden="true">
      <div class="medical-circle"></div>
      <div class="medical-cross">＋</div>
      <div class="pill pill-one"></div>
      <div class="pill pill-two"></div>
      <div class="small-circle"></div>
    </div>
  </header>

  <section class="search-card">
    <div class="section-heading">
      <span class="heading-icon">⌕</span>
      薬剤名を検索
    </div>
    <div class="search-box">
      <input id="search" type="search" placeholder="一般名・商品名を入力してください" autocomplete="off">
      <span class="search-icon">⌕</span>
      <ul id="suggestions" class="suggestions" hidden></ul>
    </div>
    <p class="hint">一般名・商品名のどちらからでも検索できます。</p>
  </section>

  <section id="result" class="result-card" aria-live="polite">
    <div class="result-icon">＋</div>
    <h2>薬剤名を入力してください</h2>
    <p>検索結果に処方可否が表示されます。</p>
  </section>

  <footer class="footer">
    <span>横浜こころとねむりのクリニック</span>
    <span>院内薬剤検索ツール</span>
  </footer>

  <p class="disclaimer">
    本ページは院内の登録リストに基づく検索補助ツールです。
    処方の最終判断は院内ルールおよび診療上の判断に従ってください。
  </p>
</main>

/*
 * 今回追加する処方可能薬。
 * プラチナマニュアル掲載の処方可能薬とは区別して管理します。
 */
const CUSTOM_APPROVED_DRUGS = [
  ["半夏厚朴湯", "ツムラ半夏厚朴湯"],
  ["加味帰脾湯", "ツムラ加味帰脾湯"],
  ["抑肝散", "ツムラ抑肝散"],
  ["半夏厚朴湯", "クラシエ半夏厚朴湯"],
  ["抑肝散加陳皮半夏", "ツムラ抑肝散加陳皮半夏"],
  ["補中益気湯", "ツムラ補中益気湯"],
  ["加味逍遙散", "ツムラ加味逍遙散"],
  ["五苓散", "ツムラ五苓散"],
  ["苓桂朮甘湯", "ツムラ苓桂朮甘湯"],
  ["柴胡加竜骨牡蛎湯", "ツムラ柴胡加竜骨牡蛎湯"],
  ["メトクロプラミド", "プリンペラン"],
  ["ダリドレキサント", "クービビック"],
  ["ボルズィ", "ボルズィ"],
  ["ドンペリドン", "ドンペリドン"]
];

/* 表記ゆれを吸収する */
const normalize = value => String(value || "")
  .toLowerCase()
  .replace(/[ 　・‐‑‒–—-]/g, "")
  .replace(/[（）()]/g, "")
  .trim();

const splitBrands = value => String(value || "")
  .split(/[／/・、,]/)
  .map(x => x.trim())
  .filter(Boolean);

function mergeDrug(target, generic, brands, approved) {
  const key = normalize(generic);
  let drug = target.find(x => normalize(x.generic) === key);

  if (!drug) {
    drug = { generic, brands: [], approved: false };
    target.push(drug);
  }

  splitBrands(brands).forEach(brand => {
    if (!drug.brands.some(x => normalize(x) === normalize(brand))) {
      drug.brands.push(brand);
    }
  });

  if (approved) drug.approved = true;
}

/* 元の院内リストを登録 */
const drugs = [];
APPROVED.forEach(([generic, brands]) => {
  mergeDrug(drugs, generic, brands, true);
});

/* 追加400件を検索候補として登録 */
ADDITIONAL_TEXT.trim().split("\n").forEach(line => {
  const [generic, brands = ""] = line.split("|");
  if (!generic || !generic.trim()) return;
  mergeDrug(drugs, generic.trim(), brands.trim(), false);
});

/* 今回追加した薬剤を検索データに登録 */
CUSTOM_APPROVED_DRUGS.forEach(([generic, brand]) => {
  mergeDrug(drugs, generic, brand, false);
});

/*
 * 今回追加した薬剤の商品名・製品名。
 * この名称に一致した場合だけ、慣習処方可能として表示します。
 */
const CUSTOM_APPROVED_NAMES = new Set(
  CUSTOM_APPROVED_DRUGS.flatMap(([generic, brand]) => [
    normalize(generic),
    normalize(brand)
  ])
);

/*
 * 施設固有の処方制限。
 * 商品名単位で判定し、同じ一般名の別製剤まで一律に制限しない。
 */
const RESTRICTED_BRANDS = new Set([
  normalize("コンサータ"),
  normalize("ビバンセ"),
  normalize("モディオダール")
]);

const searchInput = document.getElementById("search");
const suggestionBox = document.getElementById("suggestions");
const resultBox = document.getElementById("result");

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function getDrugStatus(drug, matchedName) {
  const matched = normalize(matchedName);

  /* 施設固有の処方制限を最優先 */
  if (RESTRICTED_BRANDS.has(matched)) return "restricted";

  /*
   * コンサータは徐放錠として院内リストに登録されているが、
   * 施設固有の制限を優先する。
   */
  if (
    normalize(drug.generic) === normalize("メチルフェニデート徐放錠") &&
    matched === normalize("メチルフェニデート徐放錠")
  ) return "restricted";

  /* 今回追加した薬剤は慣習処方可能として扱う */
  if (CUSTOM_APPROVED_NAMES.has(matched)) return "custom-approved";

  if (drug.approved) return "available";

  return "unavailable";
}

function makeSearchEntries() {
  const entries = [];

  drugs.forEach(drug => {
    entries.push({
      name: drug.generic,
      generic: drug.generic,
      drug,
      status: getDrugStatus(drug, drug.generic)
    });

    drug.brands.forEach(brand => {
      entries.push({
        name: brand,
        generic: drug.generic,
        drug,
        status: getDrugStatus(drug, brand)
      });
    });
  });

  return entries;
}

const entries = makeSearchEntries();

function findExact(query) {
  const q = normalize(query);
  if (!q) return null;

  /* 商品名の完全一致を一般名より優先 */
  const brandMatch = entries.find(entry =>
    entry.name !== entry.generic &&
    normalize(entry.name) === q
  );

  if (brandMatch) return brandMatch;

  return entries.find(entry =>
    normalize(entry.generic) === q
  ) || null;
}

function renderResult(entry) {
  if (!entry) {
    resultBox.className = "result-card";
    resultBox.innerHTML = `
      <div class="result-icon">?</div>
      <h2>該当する薬剤が見つかりません</h2>
      <p>薬剤名を確認して、もう一度検索してください。</p>`;
    return;
  }

  const brands = entry.drug.brands.length
    ? "商品名：" + entry.drug.brands.map(escapeHTML).join("／")
    : "商品名の登録はありません";

  if (entry.status === "restricted") {
    resultBox.className = "result-card restricted";
    resultBox.innerHTML = `
      <span class="status">処方制限</span>
      <div class="drug-name">${escapeHTML(entry.generic)}</div>
      <div class="drug-brands">${brands}</div>
      <div class="warning">
        横浜こころとねむりのクリニックでは処方できません。
      </div>`;
    return;
  }

  if (entry.status === "custom-approved") {
    resultBox.className = "result-card available";
    resultBox.innerHTML = `
      <span class="status">✓ 当院処方可能です</span>
      <div class="drug-name">${escapeHTML(entry.generic)}</div>
      <div class="drug-brands">${brands}</div>
      <div class="custom-approved-note">
        プラチナマニュアルには掲載がありませんが、慣習として処方可能です
      </div>`;
    return;
  }

  if (entry.status === "available") {
    resultBox.className = "result-card available";
    resultBox.innerHTML = `
      <span class="status">✓ 当院処方可能です</span>
      <div class="drug-name">${escapeHTML(entry.generic)}</div>
      <div class="drug-brands">${brands}</div>`;
    return;
  }

  resultBox.className = "result-card unavailable";
  resultBox.innerHTML = `
    <span class="status">当院処方が原則不可な薬です</span>
    <div class="drug-name">${escapeHTML(entry.generic)}</div>
    <div class="drug-brands">${brands}</div>
    <div class="warning">
      処方が必要と判断した場合は、カルテ内にその理由を記載してください。
    </div>`;
}

function searchSuggestions(query) {
  const q = normalize(query);

  if (!q) {
    suggestionBox.hidden = true;
    suggestionBox.innerHTML = "";
    return;
  }

  const matched = entries
    .filter(entry => normalize(entry.name).includes(q))
    .sort((a, b) => {
      const aExact = normalize(a.name).startsWith(q) ? 0 : 1;
      const bExact = normalize(b.name).startsWith(q) ? 0 : 1;
      return aExact - bExact;
    });

  /* 同じ表示名は重複させない */
  const unique = [];
  const seen = new Set();

  matched.forEach(entry => {
    const key = normalize(entry.name) + "|" + entry.status;
    if (!seen.has(key)) {
      seen.add(key);
      unique.push(entry);
    }
  });

  const limited = unique.slice(0, 12);

  suggestionBox.innerHTML = limited.map((entry, index) => {
    let statusText = "";

    if (entry.status === "restricted") {
      statusText = "当院では処方できません";
    } else if (entry.status === "custom-approved") {
      statusText = "慣習として処方可能";
    } else if (entry.status === "available") {
      statusText = "当院処方可能リストに登録";
    } else {
      statusText = "処方可能リスト外";
    }

    return `
      <li data-index="${index}">
        ${escapeHTML(entry.name)}
        <small>${escapeHTML(entry.generic)} ・ ${statusText}</small>
      </li>`;
  }).join("");

  suggestionBox.hidden = limited.length === 0;

  [...suggestionBox.children].forEach((item, index) => {
    item.addEventListener("mousedown", event => {
      event.preventDefault();
      searchInput.value = limited[index].name;
      suggestionBox.hidden = true;
      renderResult(limited[index]);
    });
  });
}

searchInput.addEventListener("input", event => {
  const value = event.target.value.trim();

  searchSuggestions(value);

  if (!value) {
    resultBox.className = "result-card";
    resultBox.innerHTML = `
      <div class="result-icon">＋</div>
      <h2>薬剤名を入力してください</h2>
      <p>検索結果に処方可否が表示されます。</p>`;
    return;
  }

  renderResult(findExact(value));
});

searchInput.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    suggestionBox.hidden = true;
  }

  if (event.key === "Enter") {
    const first = suggestionBox.querySelector("li");
    if (first) first.dispatchEvent(new MouseEvent("mousedown"));
  }
});

document.addEventListener("click", event => {
  if (!event.target.closest(".search-box")) {
    suggestionBox.hidden = true;
  }
});
</script>
